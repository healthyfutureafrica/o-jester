{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="container page center" style="padding-top:80px">
  <div class="display c-gold" style="font-size:4rem">{{ code }}</div>
  <p class="muted mt-2">{{ message or _('notFound.body') }}</p>
  <a class="btn btn-primary mt-3" href="{{ url_for('public.index') }}">{{ _('notFound.home') }}</a>
</div>
{% endblock %}
